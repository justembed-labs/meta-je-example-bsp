BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# update-image_1.0.bb `inherit swupdate` needs meta-swupdate's own
# swupdate.bbclass -- standard OE dynamic-layers convention: the recipe
# lives under dynamic-layers/meta-swupdate/, a path the wildcard above
# never matches, so BBFILES_DYNAMIC is what adds it, and only when
# meta-swupdate's own layer collection ("swupdate") is actually present.
BBFILES_DYNAMIC += "swupdate:${LAYERDIR}/dynamic-layers/meta-swupdate/recipes-*/*/*.bb \
                     swupdate:${LAYERDIR}/dynamic-layers/meta-swupdate/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "je-example"
BBFILE_PATTERN_je-example = "^${LAYERDIR}/"
BBFILE_PRIORITY_je-example = "6"
LAYERSERIES_COMPAT_je-example = "scarthgap"
